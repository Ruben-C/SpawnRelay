name: Release

# Tag a commit (e.g. `git tag v1.0.0 && git push --tags`) to build every
# platform and attach the binaries to a GitHub release. scripts/install-server.sh
# and the client installers download these assets.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: make build-all VERSION=${{ github.ref_name }}
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
